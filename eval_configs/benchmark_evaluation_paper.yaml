model:
  arch: minigpt_3d
  model_type: pretrain
  max_txt_len: 500
  end_sym: "###"
  prompt_template: 'Instruct: {} /n Output: '
  llama_model: "./params_weight/Phi_2"
  # ckpt: './params_weight/MiniGPT_3D_stage_3/MiniGPT_3D_stage_3.pth'
  # second_ckpt: "./params_weight/MiniGPT_3D_stage_4/MiniGPT_3D_stage_4.pth"
  ckpt: '/data/workspace/MiniGPT-3D/output/temp/stage_3/checkpoint_2.pth'
  second_ckpt: "/data/workspace/MiniGPT-3D/output/temp/stage_4/checkpoint_0.pth"

  # ckpt: '/data/workspace/MiniGPT-3D/output/maskmae_unfreeze/stage_3/checkpoint_2.pth'
  # second_ckpt: "/data/workspace/MiniGPT-3D/output/maskmae_unfreeze/stage_4/checkpoint_0.pth"

  # ---- pc_encoder 评估配置 ----
  # 若所有训练 stage 均 freeze_pc: True（checkpoint 中不含 pc_encoder 权重），
  # 则需要在此指定 pc_encoder 的预训练权重路径。
  # 若 freeze_pc: False（checkpoint 已含 pc_encoder），则该字段可留空或被忽略——
  # 因为 load_state_dict 会自动用 checkpoint 中的 pc_encoder 覆盖。
  pc_encoder_ckpt: "./params_weight/pc_encoder/point_model_V1+random-cls.pth"
  # pc_encoder_ckpt: "./params_weight/pc_encoder/point_model_pcp_v2.pth"
  # pc_encoder_ckpt: "./params_weight/pc_encoder/point_model.pth"
  lora_r: 64
  lora_alpha: 16
  pc_linear_layer: 2
  use_MQE: True  #  False: not use  query expert
  query_expert_router_type: 'Sparse Router'  #  three types： Constant Router, Sparse Router,  Soft Router
  query_expert_num: 8
  query_expert_top_k: 2  #  the top_k numbers of  query expert in 'Sparse Router'
  QFormer_lora_r: 8   # 0 : not use QFormer lora
  QFormer_lora_alpha: 16
  QFormer_lora_module: [ "query", "key",  "value" ]

evaluation_flag: True





