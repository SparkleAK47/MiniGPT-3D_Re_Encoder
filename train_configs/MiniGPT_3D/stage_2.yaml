model:
  arch: minigpt_3d
  model_type: pretrain
  max_txt_len: 1024
  end_sym: "###"
  llama_model: "./params_weight/Phi_2"
  ckpt: './params_weight/TinyGPT_V_stage_3/TinyGPT-V_for_Stage3.pth'
  second_ckpt: './output/pcpmae/stage_1/checkpoint_0.pth'
  use_grad_checkpoint: True
  chat_template: True
  lora_r: 64
  lora_alpha: 16
  only_train_pc_linear: False
  train_pc_encoder: True               # PCP-MAE unfrozen: pc_encoder participates in Stage II training
  freeze_pc: False                   # Allow pc_encoder parameter updates
  pc_linear_layer: 2
  use_MQE: False  #  False: not use  query expert
  query_expert_router_type: 'Sparse Router'  #  three types： Constant Router, Sparse Router,  Soft Router
  query_expert_num: 8
  query_expert_top_k: 2  #  the top_k numbers of  query expert in 'Sparse Router'
  QFormer_lora_r: 8   # 0 : not use QFormer lora
  QFormer_lora_alpha: 16
  train_QFormer_norm: True
  QFormer_lora_module: ["query", "key",  "value"]
  # pc_encoder_ckpt: "./params_weight/pc_encoder/point_model.pth"           # 原始 Point-BERT (baseline)
  pc_encoder_ckpt: "./params_weight/pc_encoder/mask-pcpmae.pth"      # PCP-MAE 预训练


datasets:
  Objaverse_brief:
    batch_size: 9   # 9
    text_processor:
      train:
        name: "blip_caption"


run:
  task: image_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"

  init_lr: 3e-5
  min_lr: 1e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  num_workers: 12

  max_epoch: 1
  warmup_steps: 7000
  iters_per_epoch: 70000


  seed: 42
  output_dir: "./output/pcpmae/stage_2"

  amp: True
  resume_ckpt_path: null

  evaluate: False 
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True

  wandb_log: True
  job_name: minigpt3d_finetune
