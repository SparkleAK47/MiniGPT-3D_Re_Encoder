model:
  arch: minigpt_3d
  model_type: pretrain
  max_txt_len: 1024
  end_sym: "###"
  llama_model: "./params_weight/Phi_2"
  # 加载 Stage 4 的最后一个 checkpoint（假设为 checkpoint_0.pth）
  ckpt: './output/pcpmae/stage_4/checkpoint_0.pth'
  use_grad_checkpoint: True
  chat_template: True
  lora_r: 64          # 保留 LLM LoRA 结构，但下面不训练它（需代码支持）
  lora_alpha: 16
  only_train_pc_linear: False
  train_pc_encoder: True               # PCP-MAE unfrozen: pc_encoder participates in Stage V training
  freeze_pc: False                     # Allow pc_encoder parameter updates
  pc_linear_layer: 2
  use_MQE: True
  only_train_MQE: False   # 让 MQE 也参与训练
  query_expert_router_type: 'Sparse Router'
  query_expert_num: 8
  query_expert_top_k: 2
  QFormer_lora_r: 8
  QFormer_lora_alpha: 16
  train_QFormer_norm: True
  QFormer_lora_module: ["query", "key", "value"]
  # pc_encoder_ckpt: "./params_weight/pc_encoder/point_model.pth"           # 原始 Point-BERT (baseline)
  pc_encoder_ckpt: "./params_weight/pc_encoder/point_model_pcp_v2.pth"      # PCP-MAE 预训练

  # 显式控制 LLM 的 LoRA 不训练（如果代码支持这种 flag）
  # 若无，可信任默认逻辑（通常“pretrain”模式下会冻结 LLM）
  train_llm: False      # 可能需要自定义，若代码无此字段则忽略

datasets:
  Objaverse_detailed:
    batch_size: 4       # 减小 batch 以适应更多可训练参数
    text_processor:
      train:
        name: "blip_caption"
    sample_ratio: 2
  Objaverse_single_round:
    batch_size: 8
    text_processor:
      train:
        name: "blip_caption"
    sample_ratio: 3
  Objaverse_mutil_round:
    batch_size: 4
    text_processor:
      train:
        name: "blip_caption"
    sample_ratio: 3

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 8e-6
  min_lr: 1e-6
  warmup_lr: 1e-6
  weight_decay: 0.05
  num_workers: 12
  max_epoch: 1
  warmup_steps: 2000
  iters_per_epoch: 10000
  seed: 42
  output_dir: "./output/pcpmae/stage_5"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  wandb_log: True
  job_name: minigpt3d_stage5